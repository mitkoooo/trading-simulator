system_seed:
  - mpid: SEED
    # - ParticipantInfo fields -
    display_name: "SYSTEM SEED"
    ptype: direct_member
    margin_category: standard_equity
    price_band_limit: 0.05
    allowed_symbols: [AAPL, MSFT, GOOG, AMZN, TSLA, NFLX, META, NVDA, INTC]
    max_order_size:
      AAPL: 100
      MSFT: 100
      GOOG: 100
      AMZN: 100
      TSLA: 100
      NFLX: 100
      META: 100
      NVDA: 100
      INTC: 100
    max_notional_per_minute: 50000
    max_msgs_per_second: 50
    clearing_member_id: "N/I"
    settlement_account: "N/I"
    initial_cash: 1000000
    initial_positions:
      AAPL: 999
      MSFT: 999
      GOOG: 999
      AMZN: 999
      TSLA: 999
      NFLX: 999
      META: 999
      NVDA: 999
      INTC: 999

