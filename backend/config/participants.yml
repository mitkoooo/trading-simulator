# ——————————————————————————————————————————————————————————
# Retail-Poisson bots: one per symbol (limit + market noise)
# ——————————————————————————————————————————————————————————
retail_bots:
  - mpid: RP_AAPL
    # - ParticipantInfo fields -
    display_name: "Appletini Retail"
    ptype: direct_member
    symbol: AAPL
    margin_category: standard_equity
    price_band_limit: 0.05
    allowed_symbols: [AAPL]
    max_order_size:
      AAPL: 5
    max_notional_per_minute: 5000
    max_msgs_per_second: 20
    clearing_member_id: "N/I"
    settlement_account: "N/I"
    initial_cash: 10000
    initial_positions:
      AAPL: 0
    # - init parameters -
    limit_rate: 1.0 # passive limit orders/sec
    market_rate: 0.2 # market orders/sec
    quantity_range: [1, 5] # shares per order
    tick_size: 0.02
    market_probability: 0.3 # 30% of events are market orders

