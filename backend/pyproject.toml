[tool.black]
line-length = 88

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["../tests"]
[project]
name = "trading-simulator-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Vadim Mitko",email = "vmmmvmm@icloud.com"}
]
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.13,<0.116.0)",
    "uvicorn (>=0.34.3,<0.35.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)"
]

[tool.poetry]
name = "trading-simulator-backend"
version = "0.1.0"
description = ""
authors = [
    "Vadim Mitko"
]

packages = [
  { include = "engine" },
  { include = "cli"    },
  { include = "view"   },
  { include = "app"    },
]


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
