[project]
name = "ghostswap-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Vadim Mitko",email = "vmmmvmm@icloud.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.13,<0.116.0)",
    "uvicorn (>=0.34.3,<0.35.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "sortedcontainers (>=2.4.0,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)"
]

[project.optional-dependencies]
dev = [
"pytest >= 8.4.1",
"pytest-cov >= 6.2.1",
"ruff>=0.5.0"
]

# CLI entry points 
[project.scripts]
ghostswap-cli = "cli.cli:main"

[tool.hatch.build.targets.wheel]
      packages = ["engine", "cli", "view", "app"]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["../tests"]
