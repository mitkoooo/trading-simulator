[project]
name = "ghostswap-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Vadim Mitko",email = "vmmmvmm@icloud.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.13,<0.116.0)",
    "uvicorn (>=0.34.3,<0.35.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "sortedcontainers (>=2.4.0,<3.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "flake8>=7.3.0",
    "mypy>=1.17.0",
    "pip>=25.2",
]

[project.optional-dependencies]
dev = [
"pytest >= 8.4.1",
"pytest-cov >= 6.2.1",
"ruff>=0.5.0"
]

# CLI entry points 
[project.scripts]
ghostswap-cli = "cli.cli:main"

[tool.hatch.build.targets.wheel]
      packages = ["engine", "cli", "view", "app"]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"




[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["./tests"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 79
indent-width = 4

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

line-ending = "auto"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle: whitespace, indentation, etc.
  "F",    # pyflakes: undefined names, imports, etc.
  "B",    # flake8-bugbear: likely bugs, bad patterns
  "I",    # isort: import sorting
  "UP",   # pyupgrade: modern syntax (e.g. f-strings)
  "N",    # pep8-naming: class/function/variable naming
  "D",    # pydocstyle: docstring style & presence
  "ANN",  # flake8-annotations: function type hints
  "C90",  # McCabe complexity: flag overly complex functions
  "RUF",  # Ruff-specific rules (e.g., unused noqa)
  "PL",   # pylint-style lints (variable naming, etc.)
  "TID",  # tidy imports: remove unused imports
  "FAST001", 
  "FAST002", 
  "FAST003"
  ]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN201"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = "True"
